<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Gustavo Gomes Balbino, AI and Machine Learning Engineer">
<style>
.bg{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
.grid{stroke:#30363d;stroke-width:1;opacity:.35}
.e{stroke:#30363d;stroke-width:1;fill:none}
.p{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:8 100;stroke-dashoffset:8;animation:flow 2.8s linear infinite}
.p1{stroke:#58a6ff}.p2{stroke:#bc8cff}
.n{fill:#161b22;stroke:#58a6ff;stroke-width:2;animation:fire 2.8s ease-in-out infinite}
@keyframes flow{0%{stroke-dashoffset:8;opacity:0}10%{opacity:1}45%{stroke-dashoffset:-100;opacity:1}46%,100%{opacity:0}}
@keyframes fire{0%,100%{fill:#161b22}15%{fill:#58a6ff}40%{fill:#161b22}}
.lab{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e;letter-spacing:2px}
.prompt{font:500 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#3fb950}
.cmd{font:500 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#e6edf3}
.name{font:800 52px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:-1px}
.role{font:600 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.meta{font:500 16px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
.cur{fill:#3fb950;animation:blink 1s steps(1) infinite}
.ch{opacity:0;animation:show .01s forwards}
@keyframes show{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
